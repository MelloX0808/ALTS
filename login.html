<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALTS Login</title>
    <style>
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif;
            background-image: url('login-bg.png'); /* Loads your background */
            background-size: cover; background-position: center;
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .overlay {
            position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.75); /* Dark overlay so the card stands out */
            z-index: 1;
        }
        .auth-card {
            background: rgba(30, 41, 59, 0.85); backdrop-filter: blur(12px);
            padding: 40px 50px; border-radius: 4px; border-top: 3px solid #f97316; /* Danger red accent */
            width: 100%; max-width: 480px; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            z-index: 2; color: #f8fafc;
        }
        .auth-header { text-align: center; margin-bottom: 35px; }
        .auth-title { margin: 0; color: #f97316; font-size: 22px; letter-spacing: 1px; text-transform: uppercase; }
        .auth-subtitle { margin: 5px 0 0 0; color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        
        .input-group { margin-bottom: 20px; }
        .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .input-label { font-size: 11px; color: #f8fafc; font-weight: bold; text-transform: uppercase; }
        .forgot-link { color: #3b82f6; text-decoration: none; font-size: 10px; text-transform: uppercase; cursor: pointer; transition: 0.2s; }
        .forgot-link:hover { color: #60a5fa; }
        
        .input-wrapper { position: relative; display: flex; align-items: center; }
        .input-icon { position: absolute; left: 12px; width: 18px; height: 18px; fill: #94a3b8; }
        .auth-input { 
            width: 100%; padding: 12px 12px 12px 40px; 
            background: transparent; border: 1px solid #334155; 
            color: #f8fafc; border-radius: 4px; font-size: 14px; 
            outline: none; transition: border-color 0.2s; box-sizing: border-box;
        }
        .auth-input::placeholder { color: #475569; }
        .auth-input:focus { border-color:  #f97316; }
        
        .eye-icon { position: absolute; right: 12px; width: 18px; height: 18px; fill: #94a3b8; cursor: pointer; transition: 0.2s; }
        .eye-icon:hover { fill: #f8fafc; }

        .btn-auth { 
            width: 100%; padding: 14px; background:  #f97316; color: white; 
            border: none; border-radius: 4px; font-weight: bold; font-size: 14px;
            cursor: pointer; margin-top: 15px; transition: 0.2s; text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-auth:hover { background: #f97316; }
        #errorText { color: #f97316; text-align: center; font-size: 13px; margin-top: 15px; height: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">ALTS INVENTORY MANAGEMENT</h2>
            <p class="auth-subtitle">Enterprise Inventory Control V4.2.0</p>
        </div>

        <div class="input-group">
            <div class="label-row">
                <span class="input-label">User ID</span>
            </div>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <input type="text" id="userBox" class="auth-input" placeholder="Enter credentials..." onkeydown="if(event.key === 'Enter') tryLogin()">
            </div>
        </div>

        <div class="input-group">
            <div class="label-row">
                <span class="input-label">Security PIN / Password</span>
                <a onclick="alert('Please contact the System Administrator to reset your credentials.')" class="forgot-link">Forgot Credentials</a>
            </div>
            <div class="input-wrapper">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
                
                <input type="password" id="passBox" class="auth-input" placeholder="••••••••" onkeydown="if(event.key === 'Enter') tryLogin()">
                
                <svg class="eye-icon" id="toggleEye" onclick="togglePassword()" viewBox="0 0 24 24">
                    <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                </svg>
            </div>
        </div>

        <button class="btn-auth" onclick="tryLogin()">LOGIN</button>
        <p id="errorText"></p>
    </div>

    <script>
        function togglePassword() {
            const passBox = document.getElementById('passBox');
            if (passBox.type === "password") {
                passBox.type = "text";
            } else {
                passBox.type = "password";
            }
        }

        async function tryLogin() {
            const u = document.getElementById('userBox').value;
            const p = document.getElementById('passBox').value;
            const payload = { username: u, password: p };

            try {
                const res = await fetch('http://127.0.0.1:5000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();
                if (data.success) {
                    // Saves the logged in user so index.html knows who wants to change their password later
                    localStorage.setItem('currentUser', u);
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('errorText').innerText = data.error || "Access Denied.";
                }
            } catch (e) {
                document.getElementById('errorText').innerText = "Server offline or disconnected.";
            }
        }
    </script>
</body>
</html>
