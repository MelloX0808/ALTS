<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ALTS Login</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    
    <div class="auth-card">
        <div class="auth-header">
            <h2 class="auth-title">SYSTEM ACCESS</h2>
            <p class="auth-subtitle">Enterprise Inventory Control</p>
        </div>

        <div class="input-group">
            <label class="input-label">User ID</label>
            <input type="text" id="userBox" class="auth-input" placeholder="Enter credentials..." onkeydown="if(event.key === 'Enter') tryLogin()">
        </div>

        <div class="input-group">
            <label class="input-label">Security PIN / Password</label>
            <input type="password" id="passBox" class="auth-input" placeholder="••••••••" onkeydown="if(event.key === 'Enter') tryLogin()">
        </div>

        <button class="btn-auth" onclick="tryLogin()">LOGIN ➔</button>
        <p id="errorText"></p>

        <a href="register.html" class="auth-link">Request System Access (Sign Up)</a>
    </div>

    <script>
        async function tryLogin() {
            const u = document.getElementById('userBox').value;
            const p = document.getElementById('passBox').value;
            const payload = { username: u, password: p };

            const res = await fetch('http://127.0.0.1:5000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            if (data.success) {
                window.location.href = 'index.html';
            } else {
                document.getElementById('errorText').innerText = data.error;
            }
        }
    </script>
</body>
</html>
